version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: asesoria-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mjose$4sesorias_13
      MYSQL_DATABASE: asesoria_legal
      MYSQL_USER: asesoria
      MYSQL_PASSWORD: mjose$4sesorias_13
    ports:
      - "3306:3306"
    volumes:
      - mysql_data_dev:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - asesoria-network-dev
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: asesoria-phpmyadmin-dev
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: mjose$4sesorias_13
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - asesoria-network-dev

volumes:
  mysql_data_dev:

networks:
  asesoria-network-dev:
    driver: bridge
